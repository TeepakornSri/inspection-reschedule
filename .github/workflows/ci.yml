# ============================================================
#  CI สำหรับโจทย์สัมภาษณ์ - กรุณา commit ไฟล์นี้ไว้ที่เดิมและไม่แก้ไข
#
#  path ที่บังคับ:
#    backend/   = NestJS app
#    frontend/  = React app
#  ทั้งสองโฟลเดอร์ต้อง commit package-lock.json ด้วย
#
#  backend/package.json  ต้องมี script: lint, build, test
#  frontend/package.json ต้องมี script: lint, build
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: inspection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d inspection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://appuser:devpassword@localhost:5432/inspection"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm run test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
