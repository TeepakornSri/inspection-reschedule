services:
  db:
    image: postgres:16
    container_name: inspection-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: inspection
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - inspection-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d inspection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inspection-data:

# DATABASE_URL:
#   postgresql://appuser:devpassword@localhost:5432/inspection
#
# seed.sql จะถูกรันอัตโนมัติเฉพาะตอนสร้าง volume ครั้งแรกเท่านั้น
# ถ้าแก้ seed.sql แล้วอยากให้มีผล ให้ล้าง volume ก่อน:
#   docker compose down -v && docker compose up -d
